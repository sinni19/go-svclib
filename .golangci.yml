version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - sloglint
    - unconvert
    - wrapcheck
  settings:
    misspell:
      locale: US
    sloglint:
      kv-only: false
      attr-only: false
      context: scope
    wrapcheck:
      # svcerr builds the errors that clients receive; wrapping them again
      # would change the public message.
      ignore-package-globs:
        - github.com/sinni19/go-svclib/svcerr
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals
          - wrapcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sinni19/go-svclib
